<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - PrimeMart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">Prime<span>Mart</span></a>
        
        <nav class="nav-links">
          <div id="auth-links" style="display: flex; gap: 1rem;">
            <a href="auth.html">Login</a>
          </div>
          
          <div id="user-menu" style="display: none; align-items: center; gap: 1rem;">
            <span class="user-name">Welcome, <span id="user-name">User</span></span>
            <button id="logout-btn" class="btn-logout">Logout</button>
          </div>
          
          <a href="cart.html" class="cart-icon">
            🛒 Cart
            <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Cart Container -->
  <section class="cart-container">
    <div class="container">
      <h1 class="cart-title">Shopping Cart</h1>
      
      <div class="cart-content">
        <!-- Cart Items -->
        <div class="cart-items">
          <div id="cart-items">
            <div class="loading">
              <div class="spinner"></div>
            </div>
          </div>
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary">
          <h2 class="summary-title">Order Summary</h2>
          <div class="summary-row">
            <span>Items</span>
            <span id="cart-count">0</span>
          </div>
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="cart-subtotal">$0.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>Free</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span id="cart-total">$0.00</span>
          </div>
          <button id="checkout-btn" class="btn-checkout" onclick="checkout()" disabled>
            Proceed to Checkout
          </button>
          <a href="index.html" class="btn-primary" style="display: block; text-align: center; margin-top: 1rem;">
            Continue Shopping
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <p>&copy; 2026 PrimeMart. All rights reserved.</p>
        <p>Built with Firebase</p>
      </div>
    </div>
  </footer>

  <!-- JavaScript -->
  <script type="module" src="app.js"></script>
</body>
</html>
