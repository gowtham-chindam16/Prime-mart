<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrimeMart - Your Online Shopping Destination</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <a href="index.html" class="logo">Prime<span>Mart</span></a>
        
        <nav class="nav-links">
          <div id="auth-links" style="display: flex; gap: 1rem;">
            <a href="auth.html">Login</a>
          </div>
          
          <div id="user-menu" style="display: none; align-items: center; gap: 1rem;">
            <span class="user-name">Welcome, <span id="user-name">User</span></span>
            <button id="logout-btn" class="btn-logout">Logout</button>
          </div>
          
          <a href="cart.html" class="cart-icon">
            🛒 Cart
            <span id="cart-badge" class="cart-badge" style="display: none;">0</span>
          </a>
        </nav>
      </div>
    </div>
  </header>

  <!-- Debug Info (remove in production) -->
  <div id="debug-info" style="background: #fee2e2; padding: 10px; text-align: center; display: none;">
    <button onclick="checkFirestoreProducts()">Debug: Check Products</button>
  </div>

  <!-- Hero Section -->
  <section class="hero">
    <div class="container">
      <h1>Welcome to PrimeMart</h1>
      <p>Discover amazing products at unbeatable prices</p>
      <a href="#products" class="btn-primary">Shop Now</a>
    </div>
  </section>

  <!-- Search & Filter -->
  <section class="search-filter">
    <div class="container">
      <div class="search-filter-content">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search products...">
        </div>
        <div class="category-filter">
          <button class="category-btn active" data-category="all">All</button>
          <button class="category-btn" data-category="Electronics">Electronics</button>
          <button class="category-btn" data-category="Clothing">Clothing</button>
          <button class="category-btn" data-category="Sports">Sports</button>
          <button class="category-btn" data-category="Home">Home</button>
          <button class="category-btn" data-category="Accessories">Accessories</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Products Section -->
  <section id="products" class="products-section">
    <div class="container">
      <h2 class="section-title">Featured Products</h2>
      <div id="products-grid" class="products-grid">
        <div class="loading">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <p>&copy; 2026 PrimeMart. All rights reserved.</p>
        <p>Built with Firebase</p>
      </div>
    </div>
  </footer>

  <!-- JavaScript -->
  <script type="module" src="app.js"></script>
</body>
</html>
